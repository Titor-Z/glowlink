<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>萤光 GlowLink · 深色小窗</title>
    <link rel="stylesheet" href="css/glowlink.css" />
  </head>
  <body class="desk">
    <!-- 320 × 500 玻璃小窗：标题栏 44 / 节点图 396 / 拖拽区 44 + 16 -->
    <main class="glow" data-glow>
      <div class="glow__window" data-window>
        <header class="titlebar">
          <span class="brand-dot" aria-hidden="true"></span>
          <h1 class="titlebar__name">萤光 GlowLink</h1>
          <div class="titlebar__actions">
            <button
              class="iconbtn"
              type="button"
              data-act="privacy"
              aria-label="隐私承诺"
              aria-expanded="false"
            >
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.4" y="6" width="7.2" height="6" rx="1.6" />
                <path d="M4.9 6V4.6a2.1 2.1 0 0 1 4.2 0V6" />
              </svg>
            </button>
            <button class="iconbtn" type="button" data-act="tray" aria-label="收进托盘">
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
                <path d="M3 10.5h8" />
              </svg>
            </button>
          </div>
        </header>

        <section class="graph" data-graph>
          <svg class="graph__wires" data-wires viewBox="0 0 320 396" aria-hidden="true"></svg>

          <!-- 本机中心节点 84px · 窗口坐标 (160, 240) -->
          <div class="node node--self">
            <span class="node__halo" aria-hidden="true"></span>
            <span class="node__ring" aria-hidden="true"></span>
            <span class="node__disc">
              <svg class="node__icon" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="6.5" width="18" height="12" rx="1.8" />
                <path d="M2.5 21.5h23" />
              </svg>
            </span>
            <span class="node__label">这台 MacBook</span>
          </div>

          <!-- 手机 52px · (66, 86) -->
          <button class="node node--phone" type="button" data-device="phone" style="--tone: #00d2d3" aria-pressed="false">
            <span class="node__halo" aria-hidden="true"></span>
            <span class="node__ring" aria-hidden="true"></span>
            <span class="node__disc">
              <svg class="node__icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="6" y="2.5" width="6" height="13" rx="1.6" />
                <path d="M8.4 13.1h1.2" />
              </svg>
            </span>
            <span class="node__label">Pixel 9</span>
          </button>

          <!-- 平板 52px · (254, 86) -->
          <button class="node node--tablet" type="button" data-device="tablet" style="--tone: #a29bfe" aria-pressed="false">
            <span class="node__halo" aria-hidden="true"></span>
            <span class="node__ring" aria-hidden="true"></span>
            <span class="node__disc">
              <svg class="node__icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.6" y="2.5" width="10.8" height="13" rx="1.6" />
                <path d="M7.9 13.1h2.2" />
              </svg>
            </span>
            <span class="node__label">iPad mini</span>
          </button>

          <!-- 台式机 52px · (160, 364) -->
          <button class="node node--desktop" type="button" data-device="desktop" style="--tone: #fd79a8" aria-pressed="false">
            <span class="node__halo" aria-hidden="true"></span>
            <span class="node__ring" aria-hidden="true"></span>
            <span class="node__disc">
              <svg class="node__icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.5" y="3.4" width="13" height="8.6" rx="1.5" />
                <path d="M6.4 15.4h5.2M9 12v3.4" />
              </svg>
            </span>
            <span class="node__label">桌面主机</span>
          </button>

          <p class="empty-note">
            <span class="spinner" aria-hidden="true"></span>
            <span>正在搜索附近设备…</span>
          </p>
        </section>

        <div class="dropzone" data-drop role="button" tabindex="0" aria-label="拖拽文件到这里发送，或按回车选择文件">
          <span data-drop-text>拖拽文件到这里</span>
        </div>

        <div class="xfer" data-xfer hidden>
          <div class="xfer__row">
            <span class="xfer__name" data-x-name>—</span>
            <span class="xfer__pct" data-x-pct>0%</span>
          </div>
          <div class="xfer__bar"><i data-x-bar></i></div>
          <p class="xfer__meta" data-x-meta>—</p>
          <div class="xfer__actions" data-x-actions hidden>
            <button class="minibtn minibtn--accent" type="button" data-act="again">再发一个</button>
            <button class="minibtn" type="button" data-act="close">关闭</button>
          </div>
        </div>

        <div class="privacy" data-privacy hidden>
          <p class="privacy__title">隐私承诺</p>
          <p class="privacy__row">无云端 · 无中转</p>
          <p class="privacy__row">无注册 · 无账号</p>
          <p class="privacy__row">无遥测 · 无日志</p>
          <p class="privacy__foot">可自行抓包验证：仅 UDP 广播 8888 与 TCP 点对点数据。</p>
        </div>

        <button class="traybar" type="button" data-traybar>
          <span class="brand-dot" aria-hidden="true"></span>
          <span>已驻留托盘</span>
          <span class="traybar__hint">· 点击恢复</span>
        </button>

        <input type="file" multiple hidden data-file />
      </div>
    </main>
    <script src="js/glowlink.js"></script>
  </body>
</html>
