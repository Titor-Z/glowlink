name: 构建与发布

# 触发时机：
# - push 到 main / PR：只跑测试与构建，不产出任何 Artifact（账号 Actions 存储额度已满，全程不碰）
# - workflow_dispatch：手动触发，同样只验证构建
# - push 形如 v0.1.4 的标签：各平台 job 直接创建 Release 并上传压缩包（Release 资产不计入存储额度）
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 标签触发时用标签名，手动触发用运行序号，保证同一轮各 job 命名一致
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # permissions 不接受表达式，只能写固定值；非标签触发时不会执行写操作
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个 macOS 架构合成一个 job：私有仓库的 macOS 计费是 ×10，少起一个 job 省一半
          - name: macOS（arm64 + x86_64）
            os: macos-14
          - name: Windows（x86_64）
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 交叉编译前置：在 arm64 runner 上编出 Intel 版
      - name: 安装 Intel 目标标准库
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: 运行测试
        run: cargo test --locked --workspace

      # macOS：两个架构都用 runner 自带的 zip 打包（zip 保留可执行位）
      - name: 打包（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for arch in aarch64 x86_64; do
            cargo build --locked --release --target "${arch}-apple-darwin" -p glowlink-cli
            name="glowlink-${VERSION}-macos-${arch}"
            stage="dist/${name}"
            mkdir -p "${stage}"
            cp "target/${arch}-apple-darwin/release/glowlink" "${stage}/"
            cp glowlink.toml README.md "${stage}/"
            chmod +x "${stage}/glowlink"
            (cd dist && rm -f "${name}.zip" && zip -qr -X "${name}.zip" "${name}")
          done
          ls -lh dist

      # Windows：镜像自带 PowerShell 与 Compress-Archive
      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release -p glowlink-cli
          $stage = "dist/glowlink-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target/release/glowlink.exe' $stage
          Copy-Item 'glowlink.toml', 'README.md' $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -Force
          Get-ChildItem dist

      # 每个平台各自建 Release（`gh release create` 幂等处理：已存在就只传资产），
      # 不经过 upload-artifact，因此不受账号 Actions 存储额度限制。
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="解压对应平台的压缩包，按其中的 README.md 运行 glowlink serve / list / send。当前为 Phase 1（CLI 概念验证）：尚无端到端加密。"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          else
            # 两个平台并行建 Release 会有一个撞 422，此时退回只传资产
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --title "萤光 GlowLink ${GITHUB_REF_NAME}" \
              --notes "${notes}" \
              || gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          fi
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
