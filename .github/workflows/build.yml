name: 构建与发布

# 触发时机：
# - push 到 main / PR：只跑测试与构建，不产出 Artifact（避免占用账号的 Actions 存储额度）
# - workflow_dispatch：手动触发，额外上传 Artifact，便于临时取用
# - push 形如 v0.1.4 的标签：创建 GitHub Release，压缩包作为 Release 资产（不计入存储额度）
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 标签触发时用标签名，其余情况用运行序号，保证同一轮各 job 命名一致
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个 macOS 架构合成一个 job：私有仓库的 macOS 计费是 ×10，少起一个 job 省一半
          - name: macOS（arm64 + x86_64）
            os: macos-14
            shell: bash
          - name: Windows（x86_64）
            os: windows-latest
            shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # 交叉编译前置：在 arm64 runner 上编出 Intel 版
      - name: 安装 Intel 目标标准库
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: 运行测试
        run: cargo test --locked --workspace

      # macOS：两个架构都用 runner 自带的 zip 打包（zip 保留可执行位）
      - name: 打包（macOS）
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for arch in aarch64 x86_64; do
            cargo build --locked --release --target "${arch}-apple-darwin" -p glowlink-cli
            name="glowlink-${VERSION}-macos-${arch}"
            stage="dist/${name}"
            mkdir -p "${stage}"
            cp "target/${arch}-apple-darwin/release/glowlink" "${stage}/"
            cp glowlink.toml README.md "${stage}/"
            chmod +x "${stage}/glowlink"
            (cd dist && rm -f "${name}.zip" && zip -qr -X "${name}.zip" "${name}")
          done
          ls -lh dist

      # Windows：镜像自带 PowerShell 与 Compress-Archive
      - name: 打包（Windows）
        if: runner.os == 'Windows'
        run: |
          cargo build --locked --release -p glowlink-cli
          $stage = "dist/glowlink-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target/release/glowlink.exe' $stage
          Copy-Item 'glowlink.toml', 'README.md' $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -Force
          Get-ChildItem dist

      # 只在手动触发时上传 Artifact：日常 push / PR 不占用账号的 Actions 存储额度
      - name: 上传产物（仅手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: glowlink-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

      # 标签触发时把压缩包交给 release job；Release 资产不计入存储额度
      - name: 暂存压缩包
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # 私有仓库还需在 Settings → Actions → General 把 Workflow permissions 设为 Read and write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: 创建 Release 并挂上压缩包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --title "萤光 GlowLink ${GITHUB_REF_NAME}" \
              --notes "解压对应平台的压缩包，按其中的 README.md 运行 glowlink serve / list / send。当前为 Phase 1（CLI 概念验证）：尚无端到端加密。"
          fi
          ls -lh dist

      # 压缩包已挂到 Release，中转用的 Artifact 立即删除，避免继续占额度
      - name: 清理中转产物
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for id in $(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | startswith("release-assets-")) | .id'
          ); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done
